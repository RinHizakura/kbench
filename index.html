<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kbench report</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  select { font: inherit; padding: .2rem; max-width: 100%; }
  label { margin-right: 1.5rem; }
  table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
  th, td { text-align: left; padding: .35rem .7rem; border-bottom: 1px solid #ddd; }
  th { border-bottom: 2px solid #999; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .reg { color: #c0392b; font-weight: 600; }
  .imp { color: #1e8449; }
  .ins { color: #999; }
  .sys { color: #666; font-size: .85rem; margin: .3rem 0; overflow-wrap: anywhere; }
  #sys table, #cfg table { font-size: .85rem; color: #444; }
  #sys td, #cfg td { overflow-wrap: anywhere; }
  #cfg summary { font-size: .85rem; color: #666; cursor: pointer; margin-top: .5rem; }
  td.diff { background: #fff3cd; }
  td span[title] { text-decoration: underline dotted #999; cursor: help; }
</style>
<h1>kbench report</h1>
<p>
  <label>platform <select id="plat"></select></label>
  <label>result <select id="cur"></select></label>
  <label>compare with <select id="base"></select></label>
  <label>benchmark <select id="bench"></select></label>
  <a id="hwlink" href="platform.html">platform info</a>
</p>
<div id="sys"></div>
<div id="cfg"></div>
<div id="out"></div>
<script type="module">
const THRESHOLD = 5;  // flag as regression if worse than baseline by this %
const q = new URLSearchParams(location.search);  // ?platform=<dir>&cur=<run>&base=<run> deep-links a comparison
const $ = id => document.getElementById(id);
const opts = { cache: "no-cache" };  // Pages sends max-age=600; revalidate so fresh runs show up immediately
const platforms = await (await fetch("data/platforms.json", opts)).json();
const plat = q.get("platform") ?? platforms[0];
for (const p of platforms) $("plat").add(new Option(p, p));
$("plat").value = plat;
$("plat").onchange = () => location.search = "?platform=" + encodeURIComponent($("plat").value);
$("hwlink").href = "platform.html?platform=" + encodeURIComponent(plat);
const DATA = await (await fetch(`data/${plat}/results.json`, opts)).json();
const names = Object.keys(DATA).sort((a, b) => DATA[b].sysinfo.date.localeCompare(DATA[a].sysinfo.date));  // newest first
for (const n of names) $("cur").add(new Option(n, n));
$("base").add(new Option("— none —", ""));
for (const n of names) $("base").add(new Option(n, n));
if (q.get("cur")) $("cur").value = q.get("cur");
$("base").value = q.get("base") ?? names[1] ?? "";  // default: newest vs previous
$("bench").add(new Option("— all —", ""));
for (const b of [...new Set(names.flatMap(n => Object.keys(DATA[n].benchmarks)))].sort())
  $("bench").add(new Option(b, b));

function metrics(r) {
  const out = [];
  for (const [bench, ms] of Object.entries(r.benchmarks))
    for (const [metric, m] of Object.entries(ms))
      out.push([bench, metric, m]);
  return out;
}

function sysTable(cur, base) {
  const keys = [...new Set([...Object.keys(cur.sysinfo), ...(base ? Object.keys(base.sysinfo) : [])])];
  const head = base
    ? "<tr><th>sysinfo</th><th>baseline</th><th>current</th></tr>"
    : "<tr><th>sysinfo</th><th>value</th></tr>";
  const rows = keys.map(k => {
    const cv = cur.sysinfo[k] ?? "–";
    if (!base) return `<tr><td>${k}</td><td>${cv}</td></tr>`;
    const bv = base.sysinfo[k] ?? "–";
    const cls = bv !== cv && k !== "date" ? ' class="diff"' : "";
    return `<tr><td>${k}</td><td${cls}>${bv}</td><td${cls}>${cv}</td></tr>`;
  }).join("");
  return `<table>${head}${rows}</table>`;
}

// kernel configs are stored deduped as data/<platform>/configs/<hash>.config; sysinfo only
// holds the hash. When cur and base hashes differ, fetch both and list the
// options that changed (set lines + "# CONFIG_X is not set" lines).
let cfgSeq = 0;
async function cfgDiff(cur, base) {
  $("cfg").innerHTML = "";
  const ch = cur.sysinfo.config, bh = base?.sysinfo.config;
  if (!ch || !bh || ch === bh) return;
  const seq = ++cfgSeq;
  const load = async h => {
    const r = await fetch(`data/${plat}/configs/${h}.config`, opts);
    const m = new Map();
    if (!r.ok) return m;
    for (const line of (await r.text()).split("\n")) {
      const set = line.match(/^(CONFIG_\w+)=(.*)/), unset = line.match(/^# (CONFIG_\w+) is not set/);
      if (set) m.set(set[1], set[2]); else if (unset) m.set(unset[1], "n");
    }
    return m;
  };
  const [mb, mc] = await Promise.all([load(bh), load(ch)]);
  if (seq !== cfgSeq) return;  // a newer selection superseded this fetch
  if (!mb.size || !mc.size) return $("cfg").innerHTML = `<p class="sys">config file missing for ${mb.size ? ch : bh}</p>`;
  const keys = [...new Set([...mb.keys(), ...mc.keys()])].filter(k => mb.get(k) !== mc.get(k)).sort();
  if (!keys.length) return $("cfg").innerHTML = `<p class="sys">configs differ only in comments</p>`;
  const rows = keys.map(k =>
    `<tr><td>${k}</td><td>${mb.get(k) ?? "–"}</td><td>${mc.get(k) ?? "–"}</td></tr>`).join("");
  $("cfg").innerHTML = `<details><summary>kernel config diff: ${keys.length} options</summary>` +
    `<table><tr><th>option</th><th>baseline</th><th>current</th></tr>${rows}</table></details>`;
}

function render() {
  const cur = DATA[$("cur").value], base = DATA[$("base").value] || null;
  $("sys").innerHTML = sysTable(cur, base);
  cfgDiff(cur, base);
  let rows = "";
  const fmt = m => (m.samples ? `<span title="runs: ${m.samples.join(", ")}">${m.value}</span>` : m.value)
    + (m.std ? ` <span class="sys">±${m.std}</span>` : "");
  for (const [bench, metric, m] of metrics(cur)) {
    if ($("bench").value && bench !== $("bench").value) continue;
    // schbench-heavy is saturated: rps + req latency are meaningful, wake latency
    // just reads back preemption granularity. schbench-light is underloaded: wake
    // latency measures scheduler responsiveness, req/rps just reflect offered load.
    if (bench === "schbench-heavy" && metric.startsWith("wake_")) continue;
    if (bench === "schbench-light" && !metric.startsWith("wake_")) continue;
    const bm = base?.benchmarks[bench]?.[metric];
    let cells = `<td class="num">${fmt(m)}</td>`;
    if (base) {
      if (bm && bm.value) {
        const d = (m.value - bm.value) / bm.value * 100;
        // confidence the delta is real: z-test on the two means (erf approx, Abramowitz–Stegun)
        // ponytail: normal approx; with n=5 a t-test would be stricter, fine for a dashboard
        const sem = x => (x.std || 0) / Math.sqrt(x.samples?.length || 1);
        const se = Math.hypot(sem(m), sem(bm));
        const erf = x => { const t = 1 / (1 + 0.3275911 * x);
          return 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
                       - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); };
        const conf = erf(Math.abs(m.value - bm.value) / (se || 1e-12) / Math.SQRT2);
        const sig = conf > 0.95;
        const worse = sig && (m.better === "higher" ? d < -THRESHOLD : d > THRESHOLD);
        const better = sig && (m.better === "higher" ? d > THRESHOLD : d < -THRESHOLD);
        const cls = worse ? "reg" : better ? "imp" : !sig ? "ins" : "";
        const st = worse ? "REGRESSION" : better ? "improved"
                 : !sig ? (Math.abs(d) > THRESHOLD ? "unconfirmed" : "–") : "ok";
        cells = `<td class="num">${fmt(bm)}</td>` + cells +
                `<td class="num ${cls}">${d > 0 ? "+" : ""}${d.toFixed(1)}%</td>` +
                `<td class="num ${cls}">${(conf * 100).toFixed(0)}%</td><td class="${cls}">${st}</td>`;
      } else {
        cells = `<td class="num">–</td>` + cells + `<td class="num"></td><td class="num"></td><td>new</td>`;
      }
    }
    rows += `<tr><td>${bench}</td><td>${metric}</td>${cells}</tr>`;
  }
  const head = base
    ? "<tr><th>benchmark</th><th>metric</th><th>baseline</th><th>current</th><th>delta</th><th>confidence</th><th>status</th></tr>"
    : "<tr><th>benchmark</th><th>metric</th><th>value</th></tr>";
  const skipped = Object.entries(cur.skipped || {})
    .map(([n, why]) => `<p class="sys">skipped ${n}: ${why}</p>`).join("");
  $("out").innerHTML = `<table>${head}${rows}</table>${skipped}`;
}
$("cur").onchange = $("base").onchange = $("bench").onchange = render;
render();
</script>
