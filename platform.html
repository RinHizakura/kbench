<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kbench platform info</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  select { font: inherit; padding: .2rem; }
  table { border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: .35rem .7rem; border-bottom: 1px solid #ddd; }
  th { border-bottom: 2px solid #999; }
</style>
<h1>platform info</h1>
<p>
  <label>platform <select id="plat"></select></label>
  <a id="back" href="index.html">← report</a>
</p>
<div id="out"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const opts = { cache: "no-cache" };
const platforms = await (await fetch("data/platforms.json", opts)).json();
const plat = q.get("platform") ?? platforms[0];
for (const p of platforms) $("plat").add(new Option(p, p));
$("plat").value = plat;
$("plat").onchange = () => location.search = "?platform=" + encodeURIComponent($("plat").value);
$("back").href = "index.html?platform=" + encodeURIComponent(plat);
const r = await fetch(`data/${plat}/hw.json`, opts);
if (!r.ok) {
  $("out").textContent = `no hw info for ${plat} yet — run kbench.py once to generate it`;
} else {
  const hw = await r.json();
  const rows = Object.entries(hw).flatMap(([k, v]) =>
    typeof v === "object"
      ? Object.entries(v).map(([sk, sv]) => `<tr><td>${k}.${sk}</td><td>${sv}</td></tr>`)
      : [`<tr><td>${k}</td><td>${v}</td></tr>`]);
  $("out").innerHTML = `<table><tr><th>property</th><th>value</th></tr>${rows.join("")}</table>`;
}
</script>
